server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/taxi_db
    username: taxi
    password: taxi
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  data:
    redis:
      host: localhost
      port: 6379
